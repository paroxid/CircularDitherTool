<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Round Dither</title>
  </head>
  <body>
    <div id="app" class="flex h-dvh overflow-hidden bg-[#090909] text-[#f4f4f5]">
      <aside class="flex w-[332px] shrink-0 flex-col border-r border-white/10 bg-[#101010]">
        <header class="px-5 pt-5 pb-4">
          <p class="text-[11px] tracking-[0.18em] text-white/40 uppercase">Round Dither</p>
          <h1 class="mt-1 text-[15px] font-medium tracking-tight">Circle contour</h1>
          <p id="file-name" class="mt-2 truncate text-[12px] text-white/45">No video loaded</p>
          <button id="open-button" class="btn btn-primary mt-4 w-full" type="button">Open video</button>
          <input
            id="file-input"
            class="hidden"
            type="file"
            accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov"
          />
        </header>
        <div id="panel" class="min-h-0 flex-1 overflow-y-auto px-5 pb-6"></div>
        <section id="export-panel" class="border-t border-white/10 px-5 py-4">
          <div class="mb-3 flex items-center justify-between">
            <p class="text-[11px] tracking-[0.18em] text-white/40 uppercase">Export</p>
            <label class="flex items-center gap-2 text-[12px] text-white/70">
              FPS
              <select id="fps">
                <option value="12">12</option>
                <option value="24">24</option>
                <option value="30" selected>30</option>
              </select>
            </label>
          </div>
          <p id="export-estimate" class="mb-3 min-h-4 text-[11px] text-white/40"></p>
          <div class="grid grid-cols-2 gap-2">
            <button class="btn" type="button" data-format="mp4" disabled>H.264 MP4</button>
            <button class="btn" type="button" data-format="webm" disabled>WebM</button>
            <button class="btn" type="button" data-format="gif" disabled>GIF</button>
            <button class="btn" type="button" data-format="png" disabled>PNG sequence</button>
          </div>
          <p id="mp4-note" class="mt-2 hidden text-[11px] text-white/40">H.264 export needs Chrome or Edge.</p>
          <div id="progress" class="mt-3 hidden h-px overflow-hidden bg-white/10">
            <div id="progress-bar" class="h-px origin-left bg-white"></div>
          </div>
          <p id="export-status" class="mt-2 min-h-4 text-[11px] text-white/55"></p>
          <button id="cancel-export" class="btn mt-2 hidden w-full" type="button">Cancel</button>
          <p class="mt-3 text-[11px] text-white/30">Frame-accurate. Video only.</p>
        </section>
      </aside>

      <div class="flex min-w-0 flex-1 flex-col">
        <div id="stage" class="relative min-h-0 flex-1 bg-black">
          <canvas id="view" class="absolute inset-0 h-full w-full object-contain"></canvas>
          <button id="empty" class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-2 bg-black/80 px-8 text-center" type="button">
            <p class="text-[11px] tracking-[0.18em] text-white/40 uppercase">Drop a video</p>
            <p class="text-[22px] font-medium tracking-tight">MP4, WebM, or MOV</p>
            <p class="max-w-sm text-[13px] leading-relaxed text-white/50">
              Dark pixels become thin rings. Midtones thicken. Bright pixels close into solid disks.
            </p>
          </button>
          <p id="stage-error" class="absolute right-4 bottom-4 left-4 hidden text-center text-[12px] text-red-300"></p>
        </div>
        <footer class="flex h-14 shrink-0 items-center gap-3 border-t border-white/10 bg-[#101010] px-4">
          <button id="play" class="icon-btn" type="button" disabled aria-label="Play"></button>
          <span id="current-time" class="w-10 text-[12px] text-white/70 tabular-nums">0:00</span>
          <input id="seek" class="seek" type="range" min="0" max="0" step="0.01" value="0" disabled aria-label="Seek" />
          <span id="duration" class="w-10 text-right text-[12px] text-white/40 tabular-nums">0:00</span>
          <button id="loop" class="btn is-on" type="button" aria-pressed="true">Loop</button>
          <button id="mute" class="btn" type="button" aria-pressed="false">Mute</button>
        </footer>
      </div>
    </div>
    <video id="source" playsinline></video>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
